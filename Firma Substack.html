<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Firma Substack" subtitle="Banner cabecera 1344×256 · v2.0 Ember on Ink" viewport="1344x420" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma Substack — Diego Maury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0612; --bg-2: #1A1128; --border: #2A1F3D;
  --t1: #FAF8FC; --t2: #9A8CB0; --t3: #8B7C9E;
  --ember: #FF5C39;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 36px 16px 44px; font-family: var(--sans);
  gap: 0; color: var(--t1);
}

.head { text-align: center; margin-bottom: 24px; flex-shrink: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ember); margin-bottom: 8px; }
.head h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.head .spec { font-family: var(--mono); font-size: 11px; color: var(--t3); letter-spacing: .04em; margin-top: 7px; }

.stage-outer { position: relative; flex-shrink: 0; }
.stage-scaler { transform-origin: top center; }

/* ─── BANNER ─── */
.banner {
  position: relative; overflow: hidden;
  background: var(--bg);
  display: flex; align-items: center;
}

/* Right surface panel */
.banner-panel {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 320px; background: var(--bg-2);
  border-left: 1px solid var(--border);
}

/* Ember top line */
.ember-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--ember); z-index: 4; }

/* Inner layout */
.inner {
  position: relative; z-index: 3;
  display: flex; align-items: center;
  padding: 0 64px; width: 100%; gap: 32px;
}

.iso { flex-shrink: 0; object-fit: contain; }
.v-rule { flex-shrink: 0; background: var(--border); border-radius: 2px; }

.txt { display: flex; flex-direction: column; justify-content: center; gap: 0; min-width: 0; }
.pub-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ember); flex-shrink: 0; }
.badge-name { font-family: var(--mono); font-size: 14px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--t2); }
.wordmark { font-size: 62px; font-weight: 700; line-height: .96; letter-spacing: -.02em; text-transform: uppercase; color: var(--t1); }
.tagline { font-size: 22px; font-weight: 300; font-style: italic; color: var(--t2); margin-top: 8px; }

.spacer { flex: 1 1 auto; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
.right-tag { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ember); }
.right-rule { width: 56px; height: 1px; background: var(--border); }
.right-url { font-family: var(--mono); font-size: 13px; color: var(--t3); letter-spacing: .03em; }

/* Controls */
.controls { display: flex; align-items: center; gap: 20px; margin-top: 20px; flex-shrink: 0; flex-wrap: wrap; justify-content: center; }
.switcher { display: flex; gap: 6px; align-items: center; }
.s-btn {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent; color: var(--t3);
  cursor: pointer; transition: all 150ms;
}
.s-btn.active, .s-btn:hover { border-color: var(--ember); color: var(--ember); background: rgba(255,92,57,.07); }
</style>
</head>
<body>

  <div class="head">
    <div class="eyebrow">Aplicación de marca · Substack</div>
    <h1>Banner de cabecera</h1>
    <div class="spec" id="specLine">1344 × 256 px · ratio 5.25:1</div>
  </div>

  <div class="stage-outer" id="stageOuter">
    <div class="stage-scaler" id="stageScaler">
      <div class="banner" id="banner" style="width:1344px;height:256px;">
        <div class="ember-line"></div>
        <div class="banner-panel"></div>
        <div class="inner">
          <img class="iso" id="isoImg" src="assets/isotipo-final-ember.svg" alt="Diego Maury" style="width:128px;height:128px;">
          <div class="v-rule" style="width:2px;height:96px;"></div>
          <div class="txt">
            <div class="pub-badge">
              <span class="badge-dot"></span>
              <span class="badge-name">Haz que Pase</span>
            </div>
            <div class="wordmark">Diego Maury</div>
            <div class="tagline">Hagamos que las cosas pasen.</div>
          </div>
          <div class="spacer"></div>
          <div class="right">
            <div class="right-tag">Newsletter</div>
            <div class="right-rule"></div>
            <div class="right-url">diegomaury.substack.com</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="switcher" id="sizeSwitcher">
      <button class="s-btn active" data-w="1344" data-h="256">Cabecera 1344×256</button>
      <button class="s-btn" data-w="1100" data-h="220">Email 1100×220</button>
    </div>
  </div>

  <script>
    let curW = 1344, curH = 256;

    function scaleStage() {
      const scaler = document.getElementById('stageScaler');
      const outer  = document.getElementById('stageOuter');
      const banner = document.getElementById('banner');
      banner.style.width  = curW + 'px';
      banner.style.height = curH + 'px';
      const avail = window.innerWidth - 40;
      const sc    = Math.min(1, avail / curW);
      scaler.style.transform = 'scale(' + sc + ')';
      scaler.style.transformOrigin = 'top center';
      outer.style.width  = (curW * sc) + 'px';
      outer.style.height = (curH * sc) + 'px';
      document.getElementById('specLine').textContent =
        curW + ' × ' + curH + ' px · ratio ' + (curW / curH).toFixed(2) + ':1';
    }

    document.querySelectorAll('#sizeSwitcher .s-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#sizeSwitcher .s-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curW = +btn.dataset.w; curH = +btn.dataset.h;
        // Adjust iso size proportionally
        const iso = document.getElementById('isoImg');
        const s = Math.round(128 * curH / 256);
        iso.style.width = s + 'px'; iso.style.height = s + 'px';
        scaleStage();
      });
    });

    window.addEventListener('resize', scaleStage);
    scaleStage();
  </script>
</body>
</html>
