<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Animation" subtitle="v2.0 · Ember on Ink · 1920×1080 · CSS animation" viewport="1920x1080" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diego Maury · Motion Brand v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0612; --bg-2: #1A1128; --border: #2A1F3D;
  --t1: #FAF8FC; --t2: #9A8CB0; --t3: #8B7C9E;
  --ember: #FF5C39;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; font-family: var(--sans);
}

/* ── Stage 1920×1080 ── */
.stage-outer { position: relative; flex-shrink: 0; }
.stage {
  width: 1920px; height: 1080px;
  background: var(--bg);
  position: relative; overflow: hidden;
  transform-origin: top left;
}

/* ── Ember accent line (top) ── */
.ember-line {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--ember);
  transform: scaleX(0); transform-origin: left center;
  animation: sweep 0.7s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* ── Center composition ── */
.center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -52%);
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
}

/* ── Isotipo ── */
.iso-wrap { width: 220px; height: 220px; position: relative; margin-bottom: 44px; }
.iso-img {
  width: 100%; height: 100%;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.8);
  clip-path: circle(0% at 50% 50%);
  animation: isoReveal 1.4s 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* ── Divider line (separator between iso and text) ── */
.div-line {
  width: 1px; height: 60px; background: var(--border);
  opacity: 0; transform: scaleY(0); transform-origin: top center;
  margin-bottom: 44px;
  animation: divReveal 0.5s 2.0s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* ── Name ── */
.dm-name {
  font-family: var(--sans); font-weight: 700;
  font-size: 94px; letter-spacing: -0.025em;
  line-height: 1; color: var(--t1);
  white-space: nowrap; text-transform: uppercase;
  position: relative; overflow: hidden;
}
.dm-name span { opacity: 0; animation: fadeIn 0.01s 2.35s linear forwards; }
.dm-name::after {
  content: attr(data-text);
  position: absolute; inset: 0; color: var(--t1);
  clip-path: inset(0 100% 0 0);
  animation: nameWipe 0.9s 2.35s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* ── Role ── */
.dm-role {
  font-family: var(--mono); font-size: 20px; font-weight: 400;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--t2); margin-top: 22px;
  opacity: 0; transform: translateY(14px);
  animation: slideUp 0.7s 3.0s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* ── Tagline ── */
.dm-tag {
  font-family: var(--mono); font-size: 16px; font-weight: 500;
  letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--ember); margin-top: 28px;
  opacity: 0;
  animation: fadeIn 1.1s 3.55s ease-out forwards;
}

/* ── Progress bar (ember solid, bottom) ── */
.progress-track {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--border);
}
.progress-fill {
  height: 100%; background: var(--ember);
  transform: scaleX(0); transform-origin: left;
  animation: sweep 5.5s 0s linear forwards;
}

/* ── Controls ── */
.ctrl-bar {
  position: absolute; bottom: 20px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 18px; z-index: 20;
}
.ctrl-btn {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  padding: 9px 22px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent;
  color: var(--t3); cursor: pointer; transition: all 200ms;
}
.ctrl-btn:hover { border-color: var(--ember); color: var(--ember); background: rgba(255,92,57,.07); }
.ctrl-label {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: .14em; text-transform: uppercase; color: var(--t3);
}

/* ── Keyframes ── */
@keyframes fadeIn   { to { opacity: 1; } }
@keyframes sweep    { to { transform: scaleX(1); } }
@keyframes nameWipe { to { clip-path: inset(0 0% 0 0); } }
@keyframes slideUp  { to { opacity: 1; transform: translateY(0); } }
@keyframes isoReveal {
  0%   { opacity: 0; transform: scale(0.8); clip-path: circle(0% at 50% 50%); }
  55%  { opacity: 1; }
  100% { opacity: 1; transform: scale(1);   clip-path: circle(75% at 50% 50%); }
}
@keyframes divReveal {
  0%   { opacity: 0; transform: scaleY(0); }
  100% { opacity: 1; transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="stage-outer">
  <div class="stage" id="stage">

    <!-- Ember top sweep -->
    <div class="ember-line"></div>

    <!-- Center composition -->
    <div class="center">
      <div class="iso-wrap">
        <img class="iso-img" src="assets/isotipo-final-ember.svg" alt="Diego Maury">
      </div>
      <div class="div-line"></div>
      <div class="dm-name" data-text="Diego Maury"><span>Diego Maury</span></div>
      <div class="dm-role">Strategic Program Director</div>
      <div class="dm-tag">Hagamos que las cosas pasen.</div>
    </div>

    <!-- Progress -->
    <div class="progress-track"><div class="progress-fill"></div></div>

    <!-- Controls -->
    <div class="ctrl-bar">
      <span class="ctrl-label">Motion Brand · 5.5s · Plus Jakarta Sans + DM Mono</span>
      <button class="ctrl-btn" id="replayBtn">&#8635; Replay</button>
    </div>

  </div>
</div>

<script>
  function scaleStage() {
    const stage = document.getElementById('stage');
    const outer = document.querySelector('.stage-outer');
    const sc = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + sc + ')';
    outer.style.width  = (1920 * sc) + 'px';
    outer.style.height = (1080 * sc) + 'px';
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();

  document.getElementById('replayBtn').addEventListener('click', () => {
    const stage = document.getElementById('stage');
    const els = stage.querySelectorAll(
      '.ember-line,.iso-img,.div-line,.dm-name span,.dm-role,.dm-tag,.progress-fill'
    );
    els.forEach(el => { el.style.animation = 'none'; });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.forEach(el => { el.style.animation = ''; });
    }));
  });
</script>
</body>
</html>
