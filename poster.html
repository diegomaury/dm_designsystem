<!DOCTYPE html>
<!-- estado: vigente — 2026-09-12 -->
<!-- @dsCard group="Brand" name="Poster — Chingón" viewport="1080x1080" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eres mucho más chingón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* snapshot v2.5 — 2026-09-12 · sincronizar contra v2-tokens.css */
  --bg: #0A0612; --bg-2: #1A1128; --bg-stage: #06030F; --border: #6A291B;
  --t1: #FAF8FC; --t2: #DDDBE0; --t3: #A8A6AC;
  --ember: #FF5C39;
  --display: 'Archivo', system-ui, sans-serif;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* surface: social */
body {
  background: var(--bg-stage); display: flex;
  align-items: center; justify-content: center;
  min-height: 100vh; font-family: var(--sans);
}
.stage-outer { flex-shrink: 0; position: relative; }
.stage-scaler { transform-origin: top center; width: 1080px; height: 1080px; }
.stage {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden;
  background: var(--bg);
}

/* Ember top line — el único acento */
.ember-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--ember); z-index: 2; }

/* Content */
.content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 96px;
}

.pre-label {
  font-family: var(--mono); font-size: 20px; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--t3); margin-bottom: 48px;
  display: flex; align-items: center; gap: 16px;
}
.pre-label::before { content: ''; display: block; width: 28px; height: 1px; background: var(--border); flex-shrink: 0; }

/* Main headline — tres líneas */
.headline { display: flex; flex-direction: column; gap: 0; }

.line-a {
  font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1.02;
  letter-spacing: -.035em; color: var(--t2);
}
.line-b {
  font-family: var(--display); font-weight: 700; font-size: 88px; line-height: 1.02;
  letter-spacing: -.035em; color: var(--ember);
}
.line-c {
  font-weight: 300; font-size: 40px; line-height: 1.08;
  letter-spacing: -.015em; color: var(--t3);
  margin-top: 16px; max-width: 860px;
}
.line-c em { font-style: normal; color: var(--t2); }

/* Bottom bar */
.bottom-bar {
  position: absolute; bottom: 48px; left: 96px; right: 96px;
  display: flex; align-items: center; justify-content: space-between; z-index: 2;
}
.lockup { display: flex; align-items: center; gap: 12px; }
.lockup img { width: 32px; height: 32px; object-fit: contain; opacity: .7; }
.v-rule { width: 1px; height: 22px; background: var(--border); }
.lockup-name { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--t3); }
.bottom-tag { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--t3); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
  <div class="stage-outer" id="stageOuter">
    <div class="stage-scaler" id="stageScaler">
      <div class="stage">
        <div class="ember-line"></div>
        <div class="content">
          <div class="pre-label">Para quien lo necesite</div>
          <div class="headline">
            <div class="line-a">Eres mucho más</div>
            <div class="line-b">chingón</div>
            <div class="line-c">que todos los que te quieren <em>chingar.</em></div>
          </div>
        </div>
        <div class="bottom-bar">
          <div class="lockup">
            <img src="assets/isotipo-final-ember.svg" alt="">
            <div class="v-rule"></div>
            <div class="lockup-name">Diego Maury</div>
          </div>
          <div class="bottom-tag">Hago que las cosas pasen.</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function scale() {
      const scaler = document.getElementById('stageScaler');
      const outer = document.getElementById('stageOuter');
      const avail = Math.min(window.innerWidth - 16, window.innerHeight - 16);
      if (avail <= 0) return; // medición transitoria: conservar la escala anterior
      if (avail < 1080) {
        const sc = avail / 1080;
        scaler.style.transform = 'scale(' + sc + ')';
        scaler.style.transformOrigin = 'top center';
        outer.style.width = (1080 * sc) + 'px';
        outer.style.height = (1080 * sc) + 'px';
      } else {
        scaler.style.transform = '';
        outer.style.width = '';
        outer.style.height = '';
      }
    }
    window.addEventListener('resize', scale);
    if (window.ResizeObserver) new ResizeObserver(scale).observe(document.documentElement);
    scale();
  </script>
</body>
</html>
