<!DOCTYPE html>
<!-- estado: vigente — 2026-09-12 -->
<!-- @dsCard group="Brand" name="Quote Cards" subtitle="1080×1080 · carousel interactivo · v2.1" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Cards — Diego Maury v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Tokens v2 ── */
:root {
  /* snapshot v2.5 — 2026-09-16 · sincronizar contra v2-tokens.css */
  --bg:    #0A0612; --bg-2: #1A1128; --border: #6A291B; --border-control: #B06A4E;
  --t1:    #FAF8FC; --t2: #DDDBE0; --t3: #A8A6AC;
  --ember: #FF5C39;
  --ember-fill: rgba(255, 92, 57, .10); --ember-fill-strong: rgba(255, 92, 57, .16);
  --light-bg: #FAF8FC; --light-text-1: #0A0612; --light-text-2: #3D2A52; --light-border: #E4DAEE;
  --display: 'Archivo', system-ui, sans-serif;
  --sans:  'Plus Jakarta Sans', system-ui, sans-serif;
  --mono:  'DM Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 24px 16px 32px;
  font-family: var(--sans); color: var(--t1); gap: 0;
}

/* surface: document — cromo de la página, no es la tarjeta */
/* ── Nav arrows ── */
.nav-row {
  display: flex; align-items: center; gap: 24px; margin-bottom: 16px;
  flex-shrink: 0;
}
.nav-btn {
  width: 44px; height: 44px; border-radius: 0;
  border: 1px solid var(--border-control); background: transparent;
  color: var(--t2); font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 120ms, color 120ms;
}
.nav-btn:hover { border-color: var(--ember); color: var(--ember); }
.nav-label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .16em; color: var(--t3); min-width: 58px; text-align: center; }

/* ── Stage outer / scaler ── */
.stage-outer { position: relative; flex-shrink: 0; }
.stage-scaler { transform-origin: top center; }

/* ── Card sizes ── */
.stage { position: relative; overflow: hidden; background: var(--bg); transition: background .2s; }
.stage.s-light { background: var(--light-bg); }

/* Cuadrado 1:1 */
.stage[data-size="sq"] { width: 1080px; height: 1080px; }
/* Historia 9:16 */
.stage[data-size="st"] { width: 1080px; height: 1920px; }
/* Landscape 16:9 */
.stage[data-size="ls"] { width: 1920px; height: 1080px; }

/* surface: social — de aquí en adelante, la tarjeta */
/* ── Ember top line ── */
.ember-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--ember); z-index: 4; }

/* ── Counter ── */
.stage-counter {
  position: absolute; top: 48px; right: 96px; z-index: 4;
  font-family: var(--mono); font-size: 20px; letter-spacing: .18em; color: var(--t3);
  display: flex; align-items: baseline; gap: 1px;
}
.stage-counter .cur { font-family: var(--sans); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; color: var(--t2); }
.s-light .stage-counter { color: rgba(42,31,61,.38); }
.s-light .stage-counter .cur { color: rgba(42,31,61,.6); }

/* ── Content ── */
.content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  gap: 48px; transition: opacity .12s ease;
}
.content.fading { opacity: 0; }

/* Padding por tamaño de tarjeta */
.stage[data-size="sq"]  .content { padding: 128px 96px 224px; }
.stage[data-size="st"]  .content { padding: 192px 96px 288px; }
.stage[data-size="ls"]  .content { padding: 96px 160px 192px; }

/* ── Quote text ── */
.quote-text {
  font-family: var(--display); font-style: italic; font-weight: 700;
  color: var(--t1); line-height: 1.02; letter-spacing: -.035em;
  position: relative; z-index: 1;
}
.s-light .quote-text { color: var(--bg-2); }

/* Tamaños por longitud — escala social, lista cerrada */
.sz-xl { font-family: var(--display); font-size: 88px; }
.sz-lg { font-family: var(--display); font-size: 64px; }
.sz-md { font-family: var(--display); font-size: 64px; }
.sz-sm { font-family: var(--display); font-size: 40px; }
.sz-xs { font-family: var(--display); font-size: 40px; }

/* En historia, un escalón arriba */
.stage[data-size="st"] .sz-lg { font-family: var(--display); font-size: 88px; }
.stage[data-size="st"] .sz-md { font-family: var(--display); font-size: 88px; }
.stage[data-size="st"] .sz-sm { font-family: var(--display); font-size: 64px; }
.stage[data-size="st"] .sz-xs { font-family: var(--display); font-size: 64px; }

/* ── Attribution ── */
.attribution { display: flex; align-items: flex-start; gap: 24px; position: relative; z-index: 1; }
.attr-rule { width: 4px; flex-shrink: 0; margin-top: 4px; border-radius: 0; background: var(--ember); height: 48px; }
.attr-body { display: flex; flex-direction: column; gap: 8px; }
.attr-label { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ember); }
.attr-blog { font-size: 28px; font-weight: 400; color: var(--t2); line-height: 1.4; }
.s-light .attr-blog { color: rgba(42,31,61,.58); }
.attr-urls { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.attr-url { font-family: var(--mono); font-size: 20px; color: var(--t3); letter-spacing: .04em; }
.s-light .attr-url { color: rgba(42,31,61,.38); }

/* ── Bottom bar ── */
.bottom-bar {
  position: absolute; bottom: 48px; left: 96px; right: 96px;
  display: flex; align-items: center; justify-content: space-between; z-index: 4;
}
.stage[data-size="ls"] .bottom-bar { left: 160px; right: 160px; }

/* ── Lockup v2 (isotipo via assets/) ── */
.lockup { display: flex; align-items: center; gap: 3.15px; }
.lockup-iso { width: 42px; height: 42px; flex-shrink: 0; }
.lockup-iso img { width: 42px; height: 42px; object-fit: contain; }
.v-rule-sm { width: 1px; height: 39px; background: var(--t1); }
.lockup-name { font-size: 18.5px; font-weight: 700; letter-spacing: .04em; line-height: 1.1; text-transform: uppercase; color: var(--t1); }
.lockup-tag { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--t3); margin-top: 4px; }
.s-light .lockup-name { color: var(--bg-2); }
.s-light .v-rule-sm { background: var(--light-border); }
.s-light .lockup-tag { color: rgba(42,31,61,.45); }

/* surface: document — cromo de la página */
/* ── Controls row ── */
.controls-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; margin-top: 16px; flex-shrink: 0;
}
.dots-wrap { display: flex; gap: 8px; align-items: center; }
.dot {
  width: 8px; height: 8px; border-radius: 0;
  background: var(--border); border: none; padding: 0;
  cursor: pointer; transition: background 120ms, transform 120ms;
}
.dot.active { background: var(--ember); transform: scale(1.6); }
.dot:hover:not(.active) { background: var(--t3); }

/* ── Style switcher ── */
.style-sw { display: flex; gap: 8px; align-items: center; }
.s-btn {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; padding: 8px 16px;
  min-height: 44px; border-radius: 0; border: 1px solid var(--border-control);
  background: transparent; color: var(--t3); cursor: pointer; transition: color 120ms, border-color 120ms;
}
.s-btn.active, .s-btn:hover { border-color: var(--ember); color: var(--ember); background: var(--ember-fill); }

/* ──────────────────────────────────────────
   PANEL DE EDICIÓN
────────────────────────────────────────── */
.edit-panel {
  width: 100%; margin-top: 24px; flex-shrink: 0;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 0; overflow: hidden;
}
.edit-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.edit-panel-title {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; color: var(--t3);
  display: flex; align-items: center; gap: 8px;
}
.edit-panel-title::before {
  content: ''; display: inline-block;
  width: 8px; height: 8px; border-radius: 0;
  background: var(--ember);
}
.panel-toggle-icon {
  font-size: 16px; color: var(--t3);
  transition: transform 120ms;
}
.panel-toggle-icon.open { transform: rotate(180deg); }

.edit-panel-body {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  overflow: hidden;
  max-height: 0;
  transition: max-height .3s cubic-bezier(.16,1,.3,1);
}
.edit-panel-body.expanded { max-height: 600px; }

/* Sección izquierda: Tamaño */
.ep-section {
  padding: 24px;
}
.ep-section + .ep-section {
  border-left: 1px solid var(--border);
}
.ep-label {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; color: var(--t3);
  margin-bottom: 16px; display: block;
}

/* Size cards */
.size-options {
  display: flex; flex-direction: column; gap: 8px;
}
.size-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 0;
  border: 1px solid var(--border-control); cursor: pointer;
  transition: border-color 120ms, background 120ms;
  background: transparent;
}
.size-card:hover { border-color: var(--ember); }
.size-card.active { border-color: var(--ember); background: var(--ember-fill); }
.size-thumb {
  flex-shrink: 0; border: 1px solid var(--border);
  border-radius: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.size-thumb.sq  { width: 28px; height: 28px; }
.size-thumb.st  { width: 18px; height: 32px; }
.size-thumb.ls  { width: 32px; height: 18px; }
.size-thumb-inner {
  width: 60%; height: 60%; background: var(--border); border-radius: 0;
}
.size-card.active .size-thumb { border-color: var(--ember); }
.size-card.active .size-thumb-inner { background: var(--ember-fill-strong); }
.size-info { display: flex; flex-direction: column; gap: 2px; }
.size-name { font-size: 16px; font-weight: 500; color: var(--t1); letter-spacing: .01em; }
.size-dim  { font-family: var(--mono); font-size: 12px; color: var(--t3); letter-spacing: .06em; }

/* Text editors */
.ep-right { display: flex; flex-direction: column; gap: 16px; }

.ep-field { display: flex; flex-direction: column; gap: 8px; }
.ep-field label {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase; color: var(--t3);
}
.ep-field textarea,
.ep-field input {
  background: var(--bg); border: 1px solid var(--border-control);
  border-radius: 0; color: var(--t1);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  padding: 12px; resize: none; outline: none;
  transition: border-color 120ms;
}
.ep-field textarea:focus,
.ep-field input:focus { border-color: var(--ember); }
.ep-field textarea { min-height: 80px; }

.ep-actions { display: flex; gap: 8px; margin-top: 4px; }
.ep-btn {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; padding: 8px 16px;
  min-height: 44px; border-radius: 0; border: 1px solid var(--border-control);
  background: transparent; color: var(--t3); cursor: pointer; transition: color 120ms, border-color 120ms;
}
.ep-btn:hover { border-color: var(--ember); color: var(--t2); }
.ep-btn.primary { border-color: var(--ember); color: var(--ember); background: var(--ember-fill); }
.ep-btn.primary:hover { background: var(--ember-fill-strong); }

/* ── Focus visible (SC 2.4.7) ── */
#prevBtn:focus-visible, #nextBtn:focus-visible,
.s-btn:focus-visible, .size-card:focus-visible,
#applyBtn:focus-visible, #resetBtn:focus-visible {
  outline: 2px solid var(--ember);
  outline-offset: 2px;
}
/* ── Non-color active indicator (SC 1.4.1) ── */
.s-btn.active { font-weight: 700; }
.size-card.active .size-name { font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Nav arrows -->
<div class="nav-row">
  <button class="nav-btn" id="prevBtn">&#8592;</button>
  <div class="nav-label" id="navLabel">01 / 10</div>
  <button class="nav-btn" id="nextBtn">&#8594;</button>
</div>

<!-- Card stage -->
<div class="stage-outer" id="stageOuter">
  <div class="stage-scaler" id="stageScaler">
    <div class="stage" id="stage" data-size="sq">
      <div class="ember-line"></div>
      <div class="stage-counter"><span class="cur" id="curNum">01</span><span>&thinsp;/&thinsp;10</span></div>

      <div class="content" id="content">
        <p class="quote-text" id="quoteText"></p>
        <div class="attribution">
          <div class="attr-rule"></div>
          <div class="attr-body">
            <span class="attr-label">Substack · Haz que Pase</span>
            <span class="attr-blog" id="attrBlog"></span>
            <div class="attr-urls">
              <span class="attr-url">diegomaury.substack.com</span>
              <span class="attr-url" style="color:var(--border);">·</span>
              <span class="attr-url">diegomaury.mx</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom bar con isotipo (assets/isotipo-dark.svg) -->
      <div class="bottom-bar">
        <div class="lockup">
          <div class="lockup-iso">
            <img src="assets/isotipo-dark.svg" width="42" height="42" alt="Diego Maury">
          </div>
          <div class="v-rule-sm"></div>
          <div>
            <div class="lockup-name">Diego Maury</div>
            <div class="lockup-tag">Hagamos que las cosas pasen.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Dots + style switch -->
<div class="controls-row" id="controlsRow">
  <div class="dots-wrap" id="dotsWrap"></div>
  <div class="style-sw">
    <button class="s-btn active" data-s="">Oscuro</button>
    <button class="s-btn" data-s="s-light">Claro</button>
  </div>
</div>

<!-- ── Panel de edición ── -->
<div class="edit-panel" id="editPanel">
  <div class="edit-panel-header" id="panelHeader">
    <span class="edit-panel-title">Editar tarjeta</span>
    <span class="panel-toggle-icon open" id="toggleIcon">&#9660;</span>
  </div>
  <div class="edit-panel-body expanded" id="panelBody">

    <!-- Izquierda: Tamaño -->
    <div class="ep-section">
      <span class="ep-label">Tamaño</span>
      <div class="size-options">
        <button class="size-card active" data-size="sq">
          <div class="size-thumb sq"><div class="size-thumb-inner"></div></div>
          <div class="size-info">
            <span class="size-name">Cuadrado</span>
            <span class="size-dim">1080 × 1080</span>
          </div>
        </button>
        <button class="size-card" data-size="st">
          <div class="size-thumb st"><div class="size-thumb-inner"></div></div>
          <div class="size-info">
            <span class="size-name">Historia</span>
            <span class="size-dim">1080 × 1920</span>
          </div>
        </button>
        <button class="size-card" data-size="ls">
          <div class="size-thumb ls"><div class="size-thumb-inner"></div></div>
          <div class="size-info">
            <span class="size-name">Landscape</span>
            <span class="size-dim">1920 × 1080</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Derecha: Texto -->
    <div class="ep-section">
      <div class="ep-right">
        <div class="ep-field">
          <label>Frase</label>
          <textarea id="editQuote" rows="4" spellcheck="false"></textarea>
        </div>
        <div class="ep-field">
          <label>Post / Blog</label>
          <input type="text" id="editBlog" spellcheck="false">
        </div>
        <div class="ep-actions">
          <button class="ep-btn primary" id="applyBtn">Aplicar</button>
          <button class="ep-btn" id="resetBtn">Restaurar</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const quotes = [
  { text: "La vida continúa. Siempre habrá nuevos proyectos… si decides seguir.", blog: "Mi más grande error como emprendedor" },
  { text: "Sí, va a doler. Pero también vas a florecer.", blog: "Lo que me enseñó la depresión" },
  { text: "Que pase lo que tenga que pasar. Sin embargo, tendrá que alcanzarme en el camino.", blog: "Lo que ni yo sabía" },
  { text: "Nunca empiezas de cero: empiezas desde la experiencia.", blog: "Lo que me enseñó la depresión" },
  { text: "Cada error es un punto de partida hacia horizontes más amplios y significativos.", blog: "Ecos Antárticos: Desafíos y Lecciones con Jorge Acevedo" },
  { text: "Transformé el dolor en combustible para forjar mi propio destino, donde las riendas de mi vida están firmemente en mis manos.", blog: "Sigo aquí: Un viaje de emprendimiento e innovación" },
  { text: "Hoy entiendo que no hay nada más grande que mi propósito, mi visión y mis capacidades.", blog: "Mi último rechazo" },
  { text: "La resiliencia no es un talento. Es una práctica. Y se cultiva.", blog: "Mi más grande error como emprendedor" },
  { text: "No necesitas ser experto en código, pero sí en contexto. Saber qué problema estás resolviendo es más importante que dominar un lenguaje.", blog: "Lo que aprendí construyendo una app sin saber programar" },
  { text: "Si quieres jugar en serio, tienes que pensar como estratega, actuar como líder y moverte como visionario.", blog: "Lunes Negro" }
];

// Size configs: [cardW, cardH]
const SIZE_MAP = {
  sq: [1080, 1080],
  st: [1080, 1920],
  ls: [1920, 1080]
};

function szClass(len) {
  if (len <= 50)  return 'sz-xl';
  if (len <= 75)  return 'sz-lg';
  if (len <= 108) return 'sz-md';
  if (len <= 132) return 'sz-sm';
  return 'sz-xs';
}

let cur = 0, busy = false;
let currentSize = 'sq';

const stage      = document.getElementById('stage');
const scaler     = document.getElementById('stageScaler');
const stageOuter = document.getElementById('stageOuter');
const content    = document.getElementById('content');
const quoteEl    = document.getElementById('quoteText');
const blogEl     = document.getElementById('attrBlog');
const curNum     = document.getElementById('curNum');
const navLabel   = document.getElementById('navLabel');
const dotsWrap   = document.getElementById('dotsWrap');
const controlsRow= document.getElementById('controlsRow');
const editQuote  = document.getElementById('editQuote');
const editBlog   = document.getElementById('editBlog');

// Build dots
quotes.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.setAttribute('aria-label', 'Quote ' + (i + 1));
  d.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(d);
});

function setContent(i) {
  const q = quotes[i];
  quoteEl.textContent = q.text;
  quoteEl.className   = 'quote-text ' + szClass(q.text.length);
  blogEl.textContent  = q.blog;
  curNum.textContent  = String(i + 1).padStart(2, '0');
  navLabel.textContent= String(i + 1).padStart(2, '0') + ' / ' + quotes.length;
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('active', j === i));
  // Sync editor fields
  editQuote.value = q.text;
  editBlog.value  = q.blog;
}

function goTo(i) {
  if (i === cur || busy) return;
  busy = true;
  content.classList.add('fading');
  setTimeout(() => {
    cur = i; setContent(i);
    content.classList.remove('fading');
    setTimeout(() => { busy = false; }, 240);
  }, 220);
}

document.getElementById('prevBtn').addEventListener('click', () => goTo((cur - 1 + quotes.length) % quotes.length));
document.getElementById('nextBtn').addEventListener('click', () => goTo((cur + 1) % quotes.length));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo((cur - 1 + quotes.length) % quotes.length);
  if (e.key === 'ArrowRight') goTo((cur + 1) % quotes.length);
});

// Style switch
document.querySelectorAll('.s-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    stage.className = ('stage ' + btn.dataset.s).trim();
    stage.dataset.size = currentSize; // preserve size attr
  });
});

// ── Size selector ──
function applySize(size) {
  currentSize = size;
  stage.dataset.size = size;
  document.querySelectorAll('.size-card').forEach(c => c.classList.toggle('active', c.dataset.size === size));
  scaleStage();
}

document.querySelectorAll('.size-card').forEach(btn => {
  btn.addEventListener('click', () => applySize(btn.dataset.size));
});

// ── Text editor ──
document.getElementById('applyBtn').addEventListener('click', () => {
  const newText = editQuote.value.trim();
  const newBlog = editBlog.value.trim();
  if (!newText) return;
  quotes[cur] = { text: newText, blog: newBlog };
  content.classList.add('fading');
  setTimeout(() => {
    setContent(cur);
    content.classList.remove('fading');
  }, 180);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  editQuote.value = quoteEl.textContent;
  editBlog.value  = blogEl.textContent;
});

// ── Panel toggle ──
document.getElementById('panelHeader').addEventListener('click', () => {
  const body = document.getElementById('panelBody');
  const icon = document.getElementById('toggleIcon');
  const isOpen = body.classList.toggle('expanded');
  icon.classList.toggle('open', isOpen);
});

// ── Scale stage to viewport ──
function scaleStage() {
  const [cardW, cardH] = SIZE_MAP[currentSize] || [1080, 1080];
  scaler.style.width  = cardW + 'px';
  scaler.style.height = cardH + 'px';

  const panelH  = 320;
  const navH    = 44 + 16 + 14 + 44; // nav + margin + controls + panel gap
  const availW  = window.innerWidth  - 32;
  const availH  = window.innerHeight - navH - panelH - 60;

  const scW = availW / cardW;
  const scH = availH / cardH;
  if (availW <= 0 || availH <= 0) return; // medición transitoria: conservar la escala anterior
  const sc  = Math.min(scW, scH, 1);

  scaler.style.transform       = sc < 1 ? `scale(${sc})` : '';
  scaler.style.transformOrigin = 'top left';
  stageOuter.style.width       = (cardW  * sc) + 'px';
  stageOuter.style.height      = (cardH  * sc) + 'px';

  const panelW = Math.min(cardW * sc, availW);
  document.getElementById('controlsRow').style.width = panelW + 'px';
  document.getElementById('editPanel').style.maxWidth = panelW + 'px';
}

window.addEventListener('resize', scaleStage);
if (window.ResizeObserver) new ResizeObserver(scaleStage).observe(document.documentElement);
scaleStage();
setContent(0);
</script>
</body>
