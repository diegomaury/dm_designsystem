<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Substack Banners" subtitle="1080×1080 · quotes Substack · v2.0" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Substack Banners — Diego Maury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,700;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0612; --bg-2: #1A1128; --border: #2A1F3D;
  --t1: #FAF8FC; --t2: #9A8CB0; --t3: #8B7C9E;
  --ember: #FF5C39;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 24px 16px 32px;
  font-family: var(--sans); color: var(--t1); gap: 0;
}
.nav-row { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--t2); font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 150ms, color 150ms;
}
.nav-btn:hover { border-color: var(--ember); color: var(--ember); }
.nav-label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .16em; color: var(--t3); min-width: 58px; text-align: center; }
.stage-outer { position: relative; flex-shrink: 0; }
.stage-scaler { transform-origin: top center; width: 1080px; height: 1080px; }
.stage {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden; background: var(--bg);
}
.stage.s-light { background: var(--bg-light, #FAF8FC); }
.ember-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--ember); z-index: 4; }

/* Top bar */
.top-bar {
  position: absolute; top: 52px; left: 72px; right: 72px;
  display: flex; align-items: center; justify-content: space-between; z-index: 5;
}
.pub-badge { display: flex; align-items: center; gap: 10px; }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ember); flex-shrink: 0; }
.badge-name { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--t2); }
.top-iso { width: 48px; height: 48px; object-fit: contain; opacity: .85; }
.s-light .badge-name { color: rgba(42,31,61,.55); }

/* Content */
.content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 158px 72px 240px; gap: 0;
  transition: opacity .22s ease;
}
.content.fading { opacity: 0; }
.quote-text {
  font-style: italic; font-weight: 700;
  color: var(--t1); line-height: 1.08; letter-spacing: -.026em;
  position: relative; z-index: 2;
}
.q-spark { color: var(--ember); font-style: italic; }
.s-light .quote-text { color: #1A1128; }
.sz-xxl { font-size: 96px; }
.sz-xl  { font-size: 82px; }
.sz-lg  { font-size: 70px; }
.sz-md  { font-size: 60px; }
.sz-sm  { font-size: 52px; }
.sz-xs  { font-size: 44px; }

/* Attribution */
.attribution {
  position: absolute; bottom: 148px; left: 72px; right: 72px;
  display: flex; align-items: flex-start; gap: 18px; z-index: 5;
}
.attr-rule { width: 3px; height: 44px; flex-shrink: 0; border-radius: 2px; background: var(--ember); margin-top: 3px; }
.attr-body { display: flex; flex-direction: column; gap: 5px; }
.attr-label { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ember); }
.attr-blog { font-size: 17px; font-weight: 400; color: var(--t2); line-height: 1.35; }
.s-light .attr-blog { color: rgba(42,31,61,.52); }

/* Bottom bar */
.bottom-bar {
  position: absolute; bottom: 52px; left: 72px; right: 72px;
  display: flex; align-items: center; justify-content: space-between; z-index: 5;
}
.lockup { display: flex; align-items: center; gap: 12px; }
.lockup img { width: 36px; height: 36px; object-fit: contain; }
.v-rule-sm { width: 1px; height: 26px; background: var(--border); }
.lockup-name { font-size: 14px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; color: var(--t1); }
.s-light .lockup-name { color: #1A1128; }
.bottom-url { font-family: var(--mono); font-size: 12px; color: var(--t3); letter-spacing: .04em; }
.s-light .bottom-url { color: rgba(42,31,61,.4); }

.controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1080px; margin-top: 14px; flex-shrink: 0; }
.dots-wrap { display: flex; gap: 7px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); border: none; padding: 0; cursor: pointer; transition: background 150ms, transform 150ms; }
.dot.active { background: var(--ember); transform: scale(1.6); }
.dot:hover:not(.active) { background: var(--t3); }
.style-sw { display: flex; gap: 7px; align-items: center; }
.s-btn { font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--t3); cursor: pointer; transition: all 150ms; }
.s-btn.active, .s-btn:hover { border-color: var(--ember); color: var(--ember); background: rgba(255,92,57,.07); }
</style>
</head>
<body>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <div class="nav-label" id="navLabel">01 / 10</div>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
  </div>

  <div class="stage-outer" id="stageOuter">
    <div class="stage-scaler" id="stageScaler">
      <div class="stage" id="stage">
        <div class="ember-line"></div>
        <div class="top-bar">
          <div class="pub-badge">
            <span class="badge-dot"></span>
            <span class="badge-name">Haz que Pase</span>
          </div>
          <img class="top-iso" src="assets/isotipo-final-ember.svg" alt="">
        </div>
        <div class="content" id="content">
          <p class="quote-text" id="quoteText"></p>
        </div>
        <div class="attribution">
          <div class="attr-rule"></div>
          <div class="attr-body">
            <span class="attr-label">Substack · Haz que Pase</span>
            <span class="attr-blog" id="attrBlog"></span>
          </div>
        </div>
        <div class="bottom-bar">
          <div class="lockup">
            <img src="assets/isotipo-final-ember.svg" alt="">
            <div class="v-rule-sm"></div>
            <div class="lockup-name">Diego Maury</div>
          </div>
          <div class="bottom-url">diegomaury.substack.com</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-row" id="controlsRow">
    <div class="dots-wrap" id="dotsWrap"></div>
    <div class="style-sw">
      <button class="s-btn active" data-s="">Oscuro</button>
      <button class="s-btn" data-s="s-light">Claro</button>
    </div>
  </div>

  <script>
    const quotes = [
      { text: "La vida continúa. Siempre habrá nuevos proyectos… si decides seguir.", key: "si decides seguir", blog: "Mi más grande error como emprendedor" },
      { text: "Sí, va a doler. Pero también vas a florecer.", key: "vas a florecer", blog: "Lo que me enseñó la depresión" },
      { text: "Que pase lo que tenga que pasar. Sin embargo, tendrá que alcanzarme en el camino.", key: "tendrá que alcanzarme en el camino", blog: "Lo que ni yo sabía" },
      { text: "Nunca empiezas de cero: empiezas desde la experiencia.", key: "desde la experiencia", blog: "Lo que me enseñó la depresión" },
      { text: "Cada error es un punto de partida hacia horizontes más amplios y significativos.", key: "punto de partida", blog: "Ecos Antárticos: Desafíos y Lecciones con Jorge Acevedo" },
      { text: "Transformé el dolor en combustible para forjar mi propio destino, donde las riendas de mi vida están firmemente en mis manos.", key: "combustible", blog: "Sigo aquí: Un viaje de emprendimiento e innovación" },
      { text: "Hoy entiendo que no hay nada más grande que mi propósito, mi visión y mis capacidades.", key: "mi propósito, mi visión y mis capacidades", blog: "Mi último rechazo" },
      { text: "La resiliencia no es un talento. Es una práctica. Y se cultiva.", key: "una práctica. Y se cultiva", blog: "Mi más grande error como emprendedor" },
      { text: "No necesitas ser experto en código, pero sí en contexto. Saber qué problema estás resolviendo es más importante que dominar un lenguaje.", key: "qué problema estás resolviendo", blog: "Lo que aprendí construyendo una app sin saber programar" },
      { text: "Si quieres jugar en serio, tienes que pensar como estratega, actuar como líder y moverte como visionario.", key: "estratega, actuar como líder y moverte como visionario", blog: "Lunes Negro" }
    ];
    function sz(len) {
      if (len <= 40) return 'sz-xxl';
      if (len <= 60) return 'sz-xl';
      if (len <= 85) return 'sz-lg';
      if (len <= 110) return 'sz-md';
      if (len <= 148) return 'sz-sm';
      return 'sz-xs';
    }
    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function render(text, key) {
      if (!key || !text.includes(key)) return esc(text);
      const i = text.indexOf(key);
      return esc(text.slice(0,i)) + '<span class="q-spark">' + esc(key) + '</span>' + esc(text.slice(i+key.length));
    }
    let cur = 0, busy = false;
    const stage = document.getElementById('stage');
    const content = document.getElementById('content');
    const quoteEl = document.getElementById('quoteText');
    const blogEl = document.getElementById('attrBlog');
    const navLabel = document.getElementById('navLabel');
    const dotsWrap = document.getElementById('dotsWrap');
    quotes.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Quote ' + (i + 1));
      d.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(d);
    });
    function setContent(i) {
      const q = quotes[i];
      quoteEl.innerHTML = render(q.text, q.key);
      quoteEl.className = 'quote-text ' + sz(q.text.length);
      blogEl.textContent = q.blog;
      navLabel.textContent = String(i + 1).padStart(2, '0') + ' / ' + quotes.length;
      document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('active', j === i));
    }
    function goTo(i) {
      if (i === cur || busy) return;
      busy = true;
      content.classList.add('fading');
      setTimeout(() => { cur = i; setContent(i); content.classList.remove('fading'); setTimeout(() => { busy = false; }, 240); }, 220);
    }
    document.getElementById('prevBtn').addEventListener('click', () => goTo((cur - 1 + quotes.length) % quotes.length));
    document.getElementById('nextBtn').addEventListener('click', () => goTo((cur + 1) % quotes.length));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goTo((cur - 1 + quotes.length) % quotes.length);
      if (e.key === 'ArrowRight') goTo((cur + 1) % quotes.length);
    });
    document.querySelectorAll('.s-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        stage.className = ('stage ' + btn.dataset.s).trim();
      });
    });
    function scaleStage() {
      const scaler = document.getElementById('stageScaler');
      const outer = document.getElementById('stageOuter');
      const controls = document.getElementById('controlsRow');
      const avail = Math.min(window.innerWidth - 32, window.innerHeight - 160);
      if (avail < 1080) {
        const sc = avail / 1080;
        scaler.style.transform = 'scale(' + sc + ')';
        scaler.style.transformOrigin = 'top center';
        outer.style.height = (1080 * sc) + 'px';
        outer.style.width = (1080 * sc) + 'px';
        controls.style.maxWidth = (1080 * sc) + 'px';
      } else {
        scaler.style.transform = '';
        outer.style.height = '';
        outer.style.width = '';
        controls.style.maxWidth = '1080px';
      }
    }
    window.addEventListener('resize', scaleStage);
    scaleStage();
    setContent(0);
  </script>
</body>
</html>
